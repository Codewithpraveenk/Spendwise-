# Free portfolio deployment. Sleeping instances pause queued email retries.
# Enter all secret values in Render; never replace sync:false with credentials.
services:
  - type: web
    name: spendwise
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix server && npm run build
    startCommand: npm --prefix server run db:indexes && npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_FRONTEND
        value: "true"
      # Conservative default until the hosting proxy topology is verified.
      - key: TRUST_PROXY
        value: "false"
      - key: MAIL_PROVIDER
        value: brevo
      - key: APP_ORIGIN
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAIL_ENCRYPTION_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
