# Free portfolio deployment. Sleeping instances pause queued email retries.
# Enter all secret values in Render; never replace sync:false with credentials.
services:
  - type: web
    name: spendwise
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm ci --prefix server --omit=dev && npm run build
    startCommand: npm --prefix server run db:indexes && npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_FRONTEND
        value: "true"
      # Conservative default until the hosting proxy topology is verified.
      - key: TRUST_PROXY
        value: "false"
      # Preview deliberately has no recovery email until provider setup is completed.
      - key: MAIL_PROVIDER
        value: disabled
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 1059108087065-vv0of1bp41racthn8a5dsmdehj102frt.apps.googleusercontent.com
